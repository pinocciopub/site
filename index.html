<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Pinoccio Pub</title>
    <style>
        @font-face {
            font-family: 'Mono';
            src: url('CommitMono-400-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .header-group {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            z-index: 10;
            align-items: flex-start; 
        }

        .logo-link {
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        .logo {
            height: 60px; 
            width: auto; 
            max-width: none; 
            display: block;
            transition: all 0.2s ease;
        }

        .description {
            font-family: 'Mono', monospace;
            font-size: 12px;
            color: #000000;
            text-align: left;
            display: flex;
            gap: 40px; 
            align-items: flex-start;
            padding-bottom: 20px; 
            padding-right: 20px; 
        }

        .press-link {
            display: inline-block;
            color: #0000FF;
            text-decoration: none;
            font-family: 'Mono', monospace;
            font-size: 12px;
            line-height: 1; 
            cursor: pointer;
        }

        .press-link:hover {
            text-decoration: underline;
        }

        .catalogue-container {
            display: none; 
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            font-family: 'Mono', monospace;
            font-size: 12px;
            gap: 40px; 
            align-items: flex-start; 
            position: relative; 
        }

        .numbers-grid {
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }

        /* 1. Base state for numbers (hidden and shifted down) */
        .cat-number {
            color: #000;
            text-decoration: none;
            cursor: pointer;
            line-height: 1; 
            opacity: 0;
            transform: translateY(8px);
            transition: color 0.15s ease, opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .cat-number:hover {
            color: #0000FF; 
            text-decoration: underline;
        }

        /* 2. Open state (triggered by JavaScript class) */
        .catalogue-container.open .cat-number {
            opacity: 1;
            transform: translateY(0);
        }

        /* 3. Pure CSS staggering for the waterfall effect */
        .cat-number:nth-child(1) { transition-delay: 0.00s; }
        .cat-number:nth-child(2) { transition-delay: 0.05s; }
        .cat-number:nth-child(3) { transition-delay: 0.10s; }
        .cat-number:nth-child(4) { transition-delay: 0.15s; }
        .cat-number:nth-child(5) { transition-delay: 0.20s; }
        .cat-number:nth-child(6) { transition-delay: 0.25s; }
        .cat-number:nth-child(7) { transition-delay: 0.30s; }

        .title-display {
            white-space: pre-line;
            min-width: 300px;
            text-transform: uppercase;
            min-height: 60px; 
            margin-top: 0;
            line-height: 1.6;
            opacity: 0; 
            transition: transform 0.15s ease-out, opacity 0.2s ease-in-out; 
        }

        .center-image {
            max-width: 50%;
            max-height: 60vh;
            height: auto;
            margin-top: 120px;
            transform-origin: top center;
            animation: swing 3.5s ease-in-out infinite alternate;
            transition: opacity 0.5s ease-in-out;
        }

        @keyframes swing {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; justify-content: flex-start; padding: 20px; height: auto; overflow-y: auto; }
            .header-group { position: static; width: 100%; margin-bottom: 40px; }
            .logo { height: 40px; width: auto; max-width: 100%; }
            .description { flex-direction: column; gap: 10px; padding-bottom: 0; padding-right: 0; }
            .catalogue-container { flex-direction: column; gap: 20px; }
            .title-display { transform: translateY(0) !important; min-height: auto; } 
            .center-image { max-width: 80%; margin-top: 20px; }
            /* Show instantly on mobile */
            .cat-number { opacity: 1; transform: translateY(0); transition-delay: 0s; }
        }
    </style>
</head>
