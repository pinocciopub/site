<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Pinoccio Pub</title>
    <style>
        @font-face {
            font-family: 'Mono';
            src: url('CommitMono-400-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .header-group {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            z-index: 10;
            align-items: flex-start; 
        }

        .logo {
            height: 60px; 
            width: auto; 
            max-width: none; 
            display: block;
        }

        .description {
            font-family: 'Mono', monospace;
            font-size: 12px;
            color: #000000;
            line-height: 1.6;
            text-align: left;
            display: flex;
            gap: 40px; /* Matched distance between [CATALOGUE] and numbers */
            align-items: flex-start;
        }

        .press-link {
            display: inline-block;
            color: #0000FF;
            text-decoration: none;
            font-family: 'Mono', monospace;
            font-size: 12px;
            cursor: pointer;
        }

        .press-link:hover {
            text-decoration: underline;
        }

        .catalogue-container {
            display: none; 
            opacity: 0;
            transition: opacity 0.5s ease-in;
            font-family: 'Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            gap: 40px; /* Matched distance between numbers and titles */
            align-items: flex-start; 
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: 5px 15px;
        }

        .cat-number {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }

        .cat-number:hover {
            text-decoration: underline;
        }

        .title-display {
            white-space: pre-line;
            min-width: 300px;
            text-transform: uppercase;
            min-height: 60px; 
            margin-top: 0;
        }

        .center-image {
            max-width: 50%;
            max-height: 60vh;
            height: auto;
            margin-top: 120px;
            transform-origin: top center;
            animation: swing 3.5s ease-in-out infinite alternate;
            transition: opacity 0.5s ease-out;
        }

        @keyframes swing {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                justify-content: flex-start;
                padding: 20px;
                height: auto;
                overflow-y: auto;
            }

            .header-group {
                position: static;
                width: 100%;
                margin-bottom: 40px;
            }

            .logo {
                height: 40px; 
                width: auto;
                max-width: 100%;
            }

            .description {
                flex-direction: column;
                gap: 10px;
            }

            .catalogue-container {
                flex-direction: column;
                gap: 20px;
            }

            .center-image {
                max-width: 80%;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="header-group">
        <img src="pp-logo-01-02.svg" alt="Pinoccio Logo" class="logo" id="main-logo">
        <div class="description">
            <a id="catalogue-trigger" class="press-link">[CATALOGUE]</a>
            
            <div id="catalogue-content" class="catalogue-container">
                <div class="numbers-grid">
                    <a href="001-apokryferna.html" class="cat-number" data-title="ALEXANDER SAND&#10;AP0KRYFERNA / NATTBOK (2016)&#10;BOOK" data-logo="pp-logo-01-02.svg">001</a>
                    <a href="002-ett-misslyckat-hjarta.html" class="cat-number" data-title="ALEXANDER SAND&#10;ETT MISSLYCKAT HJÄRTA (2019)&#10;BOOK" data-logo="pp-logo-01-02.svg">002</a>
                    <a href="003-sokaren.html" class="cat-number" data-title="ALEX SAND&#10;SÖKAREN (2024)&#10;SINGLE - DIGITAL" data-logo="pp-logo-03.svg">003</a>
                    <a href="004-paraply.html" class="cat-number" data-title="ALEXANDER SAND&#10;PARAPLY (2025)&#10;SINGLE - DIGITAL" data-logo="pp-logo-04.svg">004</a>
                    <a href="005-kalla-vindar.html" class="cat-number" data-title="SKAMMEN&#10;KALLA VINDAR (2026)&#10;SINGLE - DIGITAL" data-logo="pp-logo-05.svg">005</a>
                    <a href="006-skammen-lyfter.html" class="cat-number" data-title="SKAMMEN&#10;LYFTER (2026)&#10;SINGLE - DIGITAL" data-logo="pp-logo-06.svg">006</a>
                    <a href="007-mitt-i-naturen.html" class="cat-number" data-title="MOE&#10;MITT I NATUREN (2026)&#10;EP - DIGITAL" data-logo="pp-logo-07.svg">007</a>
                </div>
                <div id="hover-title" class="title-display"></div>
            </div>
        </div>
    </div>

    <img src="start-img.png" alt="Dangling Illustration" id="landing-image" class="center-image">

    <script>
        const catalogueTrigger = document.getElementById('catalogue-trigger');
        const catalogueContent = document.getElementById('catalogue-content');
        const landingImage = document.getElementById('landing-image');
        const hoverTitleDisplay = document.getElementById('hover-title');
        const catNumbers = document.querySelectorAll('.cat-number');
        
        const mainLogo = document.getElementById('main-logo');
        const defaultLogoSrc = mainLogo.getAttribute('src');
        
        let logoTimeout;

        if (catalogueTrigger) {
            catalogueTrigger.addEventListener('click', (e) => {
                e.preventDefault(); 
                
                landingImage.style.opacity = '0';
                
                setTimeout(() => {
                    landingImage.style.display = 'none';
                    
                    catalogueContent.style.display = 'flex';
                    requestAnimationFrame(() => {
                        catalogueContent.style.opacity = '1';
                    });
                }, 500); 
            });
        }

        catNumbers.forEach(link => {
            link.addEventListener('mouseenter', function() {
                clearTimeout(logoTimeout);
                
                hoverTitleDisplay.textContent = this.getAttribute('data-title');
                const logoFile = this.getAttribute('data-logo');
                if (logoFile) {
                    mainLogo.src = logoFile;
                }
            });
            
            link.addEventListener('mouseleave', function() {
                hoverTitleDisplay.textContent = '';
                
                logoTimeout = setTimeout(() => {
                    mainLogo.src = defaultLogoSrc;
                }, 100); 
            });
        });
    </script>
</body>
</html>
