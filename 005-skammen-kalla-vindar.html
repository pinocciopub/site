<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinoccio Pub | 001</title>
    <link class="favicon" rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @font-face {
            font-family: 'Mono';
            src: url('CommitMono-400-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .header-group {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            z-index: 10;
            align-items: flex-start; 
        }

        .logo-link {
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        .logo {
            height: 60px; 
            width: auto;
            max-width: none;
            display: block;
            transition: all 0.2s ease;
        }

        .description {
            font-family: 'Mono', monospace;
            font-size: 12px;
            color: #000000;
            text-align: left;
            display: flex;
            gap: 40px; 
            align-items: flex-start;
            padding-bottom: 20px; 
            padding-right: 20px; 
        }

        .catalogue-container {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            font-family: 'Mono', monospace;
            font-size: 12px;
            gap: 40px; 
            align-items: flex-start; 
            position: relative;
        }

        .numbers-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cat-number {
            color: #000;
            text-decoration: none;
            cursor: pointer;
            line-height: 1;
            opacity: 0;
            transform: translateY(8px);
            transition: color 0.15s ease, opacity 0.2s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .cat-number:hover {
            color: #0000FF; 
            text-decoration: underline;
        }

        .cat-number.show {
            opacity: 1;
            transform: translateY(0);
        }

        .title-display {
            white-space: pre-line;
            min-width: 300px;
            text-transform: uppercase;
            min-height: 60px; 
            margin-top: 0;
            line-height: 1.6;
            opacity: 0;
            color: #000;
            text-decoration: none;
            display: block;
            transition: transform 0.15s ease-out, opacity 0.2s ease-in-out, color 0.15s ease;
        }

        .title-display:hover {
            color: #0000FF;
            text-decoration: underline;
            cursor: pointer;
        }

        .nav-link {
            display: inline-block;
            color: #0000FF; 
            text-decoration: none; 
            font-family: 'Mono', monospace;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .content-container {
            max-width: 660px;
            width: 90%;
            margin-top: 220px; 
            margin-bottom: 100px; 
            display: flex;
            flex-direction: column;
        }

        p {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #000000;
            line-height: 1.7; 
            margin: 0;
            text-align: left;
            width: 100%;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .header-group { position: static; width: 100%; margin-bottom: 40px; }
            .logo { height: 40px; width: auto; max-width: 100%; }
            .description { flex-direction: column; gap: 10px; padding-bottom: 0; padding-right: 0;}
            .catalogue-container { flex-direction: column; gap: 20px; }
            .title-display { transform: translateY(0) !important; min-height: auto; }
            .content-container { margin-top: 0; width: 100%; }
            .cat-number { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-group">
        <a href="index.html" class="logo-link">
            <!-- DEFAULT LOGO GOES HERE -->
            <img src="pp-logo-01-02.svg" alt="Pinoccio Logo" class="logo" id="main-logo">
        </a>
        
        <div class="description" id="menu-area">
            <a href="index.html" class="nav-link" id="catalogue-trigger">[CATALOGUE]</a>
            
            <div id="catalogue-content" class="catalogue-container">
                <div class="numbers-grid">
                    <a href="001-alexander-sand-apokryferna-nattbok.html" class="cat-number" data-title="ALEXANDER SAND&#10;AP0KRYFERNA / NATTBOK (2016)&#10;BOOK" data-logo="pp-logo-01-02.svg">001</a>
                    <a href="002-alexander-sand-ett-misslyckat-hjarta.html" class="cat-number" data-title="ALEXANDER SAND&#10;ETT MISSLYCKAT HJÄRTA (2019)&#10;BOOK" data-logo="pp-logo-01-02.svg">002</a>
                    <a href="003-alex-sand-sokaren.html" class="cat-number" data-title="ALEX SAND&#10;SÖKAREN (2024)&#10;SINGLE - DIGITAL" data-logo="pp-logo-03.svg">003</a>
                    <a href="alex-sand-paraply.html" class="cat-number" data-title="ALEXANDER SAND&#10;PARAPLY (2025)&#10;SINGLE - DIGITAL" data-logo="pp-logo-04.svg">004</a>
                    <a href="005-kalla-vindar.html" class="cat-number" data-title="SKAMMEN&#10;KALLA VINDAR (2026)&#10;SINGLE - DIGITAL" data-logo="pp-logo-05.svg">005</a>
                    <a href="006-skammen-lyfter.html" class="cat-number" data-title="SKAMMEN&#10;LYFTER (2026)&#10;SINGLE - DIGITAL" data-logo="pp-logo-06.svg">006</a>
                    <a href="007-moe-mitt-i-naturen.html" class="cat-number" data-title="MOE&#10;MITT I NATUREN (2026)&#10;EP - DIGITAL" data-logo="pp-logo-07.svg">007</a>
                </div>
                <a id="hover-title" class="title-display"></a>
            </div>
        </div>
    </div>

    <div class="content-container">
        <!-- Minimal Content Section -->
        <p>COMING SOON</p>
    </div>

    <script>
        const menuArea = document.getElementById('menu-area');
        const catalogueContent = document.getElementById('catalogue-content');
        const hoverTitleDisplay = document.getElementById('hover-title');
        const catNumbers = document.querySelectorAll('.cat-number');
        
        const mainLogo = document.getElementById('main-logo');
        const defaultLogoSrc = mainLogo.getAttribute('src');
        
        let numberHoverTimeout;
        let menuCloseTimeout;

        menuArea.addEventListener('mouseenter', () => {
            clearTimeout(menuCloseTimeout); 
            
            catalogueContent.style.display = 'flex';
            setTimeout(() => {
                catalogueContent.style.opacity = '1';
                
                catNumbers.forEach((link, index) => {
                    setTimeout(() => {
                        link.classList.add('show');
                    }, index * 50); 
                });
            }, 50);
        });

        menuArea.addEventListener('mouseleave', () => {
            menuCloseTimeout = setTimeout(() => {
                catalogueContent.style.opacity = '0';
                mainLogo.src = defaultLogoSrc;
                
                setTimeout(() => {
                    if (catalogueContent.style.opacity === '0') {
                        catalogueContent.style.display = 'none';
                        catNumbers.forEach(link => link.classList.remove('show'));
                        hoverTitleDisplay.style.opacity = '0';
                        hoverTitleDisplay.textContent = '';
                        hoverTitleDisplay.removeAttribute('href');
                        hoverTitleDisplay.style.transform = `translateY(0px)`;
                    }
                }, 300);
            }, 150); 
        });

        function startNumberLeaveTimer() {
            numberHoverTimeout = setTimeout(() => {
                if (catalogueContent.style.opacity === '1') {
                    hoverTitleDisplay.style.opacity = '0';
                    mainLogo.src = defaultLogoSrc;
                    
                    setTimeout(() => {
                        if (hoverTitleDisplay.style.opacity === '0') {
                            hoverTitleDisplay.textContent = '';
                            hoverTitleDisplay.removeAttribute('href');
                            hoverTitleDisplay.style.transform = `translateY(0px)`;
                        }
                    }, 200);
                }
            }, 600); 
        }

        catNumbers.forEach(link => {
            link.addEventListener('mouseenter', function() {
                clearTimeout(numberHoverTimeout);
                
                hoverTitleDisplay.textContent = this.getAttribute('data-title');
                hoverTitleDisplay.href = this.href;
                hoverTitleDisplay.style.transform = `translateY(${this.offsetTop - 2}px)`; 
                hoverTitleDisplay.style.opacity = '1';
                
                const logoFile = this.getAttribute('data-logo');
                if (logoFile) {
                    mainLogo.src = logoFile;
                }
            });
            
            link.addEventListener('mouseleave', startNumberLeaveTimer);
        });

        hoverTitleDisplay.addEventListener('mouseenter', () => {
            clearTimeout(numberHoverTimeout);
        });
        
        hoverTitleDisplay.addEventListener('mouseleave', startNumberLeaveTimer);
    </script>
</body>
</html>
